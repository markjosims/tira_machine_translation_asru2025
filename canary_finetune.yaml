# @package _global_
# Configuration for fine-tuning Canary Qwen 2.5B
# generated using Gemini Fast on 5 Dec 2025
name: "Canary_Qwen_2_5B_Finetune"
exp_dir: "nemo_experiments"

# --- Trainer Configuration ---
trainer:
  devices: 1         # Number of GPUs to use (adjust based on your hardware)
  num_nodes: 1       # Number of nodes
  max_epochs: 5      # Or max_steps
  max_steps: -1      # Set to -1 to use max_epochs
  accelerator: "gpu"
  strategy: "ddp"    # Distributed strategy (use 'fsdp' for better scaling)
  log_every_n_steps: 50
  val_check_interval: 1000 # Run validation every 1000 steps

# --- Model Configuration ---
model:
  target: nemo.collections.speechlm2.models.SALM
  init_from_pretrained_model: "nvidia/canary-qwen-2.5b" # Load the base model

  # **Data configuration**
  data:
    # --- Training Data ---
    train_dl_config:
      manifest_filepath: "/mnt/LocalStorage/datasets/mjsimmons/tira_asr_translated/nemo/nemo_train_manifest.jsonl"
      batch_size: 4  # Adjust based on VRAM. SALM models are memory-intensive.
      num_workers: 4
      pin_memory: true
      drop_last: true
      shuffle: true
    # --- Validation Data ---
    val_dl_config:
      manifest_filepath: "/mnt/LocalStorage/datasets/mjsimmons/tira_asr_translated/nemo/nemo_validation_manifest.jsonl"
      batch_size: 2
      num_workers: 2
      pin_memory: true
      drop_last: false
      shuffle: false

  # **Tokenizer/Prompt Configuration (Essential for SALM)**
  tokenizer:
    library: Qwen # The underlying LLM's tokenizer

  # **PEFT (Parameter-Efficient Fine-Tuning) Configuration**
  # We only train the ASR Encoder and LoRA adapters on the LLM
  peft:
    peft_scheme: lora
    lora_tuning_cfg:
      r: 8
      lora_alpha: 32
      lora_dropout: 0.05
    # Freeze the main LLM weights, train LoRA and ASR components
    freeze_llm: True
    # The ASR encoder will likely be trainable by default, but confirm in the NeMo example script!

  # **Optimizer and Learning Rate Scheduler**
  optim:
    name: "adamw"
    lr: 5.0e-5
    betas: [0.9, 0.95]
    weight_decay: 0.01
    sched:
      name: "CosineAnnealing"
      warmup_steps: 1000
      max_steps: -1 # Will be calculated automatically if max_epochs is set

  perception:
    # 1. Feature Extractor (Conformer/FastConformer standard)
    feat_freq: 80
    feat_dims: 1024

    # 2. Audio Preprocessor Configuration
    preprocessor:
      _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
      sample_rate: 16000
      features: 80
      window_size: 0.025
      window_stride: 0.01
      normalize: "per_feature"
      dither: 0.0
      pad_to: 16

    # 3. Encoder Configuration (Required to define the FastConformer)
    encoder:
      _target_: nemo.collections.asr.modules.ConformerEncoder
      feat_in: 80
      n_layers: 32 # Canary-1b-flash has 32 encoder layers
      d_model: 1024