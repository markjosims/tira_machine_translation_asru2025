# @package _global_
# generated with Gemini Fast on 5 Dec 2025
name: "Canary_Qwen_Tira_MT"

# 1. Boilerplate Trainer Config
trainer:
  devices: 1
  num_nodes: 1
  accelerator: gpu
  strategy: auto
  precision: bf16-mixed # Canary Qwen works best with bf16
  max_epochs: 10
  log_every_n_steps: 10
  gradient_clip_val: 1.0
  accumulate_grad_batches: 16
  val_check_interval: -1 # set dynamically in `train_canary.py`
  logger: True
  max_steps: -1

# 2. Experiment Manager
exp_manager:
  exp_dir: "${oc.env:NEMO_EXP_DIR, .}/canary_qwen_tira_mt"
  name: ${name}
  create_checkpoint_callback: False
  create_tensorboard_logger: True
  checkpoint_callback_params:
    save_top_k: 3
    monitor: "val_loss"
    mode: "min"
    save_last: True

# 3. Model Configuration (The Critical Part)
model:
  # This acts as the "base" configuration
  # We load the pretrained SALM model
  audio_locator_tag: "<|audioplaceholder|>"
  restore_from_path: null # Leave null, we load via init_from_pretrained_model
  # Specify the components used to build the final model
  pretrained_llm: "Qwen/Qwen3-1.7B"      # The base LLM component
  pretrained_asr: "nvidia/canary-1b-flash" # The base ASR/Encoder component
  pretrained_weights: True
  prompt_format: "qwen"

  # The key you were using to load the final checkpoint
  init_from_pretrained_model: "nvidia/canary-qwen-2.5b"

  # PEFT / LoRA Configuration
  # We freeze the massive LLM and only train small adapters
  peft:
    enabled: true
    peft_scheme: "lora" # use qlora for less memory footprint
    lora_tuning:
      adapter_dim: 32
      adapter_dropout: 0.05
      target_modules: ['q_proj', 'v_proj', 'k_proj', 'o_proj'] # Standard Qwen targets

  perception:
    _target_: nemo.collections.speechlm2.modules.perception.AudioPerceptionModule
    output_dim: 2048  # Crucial: This matches Qwen's embedding size

    # The Encoder (Canary-1B Flash uses FastConformer)
    encoder:
      _target_: nemo.collections.asr.modules.ConformerEncoder
      feat_in: 80
      n_layers: 32
      d_model: 1024
      # ... other encoder params can be left to default or added if needed
      # activation_checkpointing: true  # uncomment for less memory footprint
      # activation_checkpointing_mode: 'full'

    # The Preprocessor (Standard AudioToMel)
    preprocessor:
      _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
      sample_rate: 16000
      features: 80
      window_size: 0.025
      window_stride: 0.01
      normalize: "per_feature"
      dither: 0.0
      pad_to: 16

    # The Adapter (Use IdentityConnector with the correct input dimension)
    modality_adapter:
      _target_: nemo.collections.speechlm2.modules.perception.IdentityConnector
      d_model: 1024 # Matches the Encoder output

  # Optimizer config (Standard for LLM fine-tuning)
  optimizer:
    _target_: torch.optim.AdamW # bitsandbytes.optim.AdamW8bit for less memory footprint
    lr: 1e-4
    weight_decay: 0.01
    betas: [0.9, 0.95]

  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    # Note: 'optimizer' arg is passed automatically in python, don't define it here
    T_max: "${trainer.max_steps}"
    eta_min: 1e-6

# Data Configuration
data:
  # --- TRAIN DATA ---
  train_ds:
    sample_rate: 16000
    token_equivalent_duration: 0.08
    batch_size: 1 # Keep small, SALMs are VRAM hungry
    num_workers: 4
    pin_memory: true
    min_duration: 0.5
    max_duration: 30.0
    prompt_format: "${model.prompt_format}"

    # This 'input_cfg' is what converts your simple manifest into
    # the "Prompt + Audio -> Response" format the model needs.
    input_cfg:
      - type: "lhotse_as_conversation"
        manifest_filepath: "${oc.env:DATASETS, .}/tira_asr_translated/nemo/nemo_train_manifest.jsonl"
        audio_locator_tag: ${model.audio_locator_tag}

        # HERE IS WHERE YOU DEFINE THE TASK
        # For Translation, be explicit about the target language.
        # Example: "Translate the following audio to English:"
        # If your manifest 'text' field contains the translation,
        # this maps it to the model's expected 'answer'.
        tags:
          answer: "pred_text"
          context: "Translate the following audio into English:"

  # --- VALIDATION DATA ---
  validation_ds:
    sample_rate: 16000
    token_equivalent_duration: 0.08
    batch_size: 4
    num_workers: 4
    prompt_format: "${model.prompt_format}"
    datasets:
        val_set_0:
          input_cfg:
          - type: "lhotse_as_conversation"
            manifest_filepath: "${oc.env:DATASETS, .}//tira_asr_translated/nemo/nemo_validation_manifest.jsonl"
            audio_locator_tag: ${model.audio_locator_tag}
            tags:
              answer: "pred_text"
              context: "Translate the following audio into English:"